<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:440px;height:280px;overflow:hidden;font-family:"Nunito Sans",system-ui,sans-serif;background:#080b11;color:#e9ecf4}
.tile{position:relative;width:440px;height:280px;display:flex;align-items:center;gap:18px;padding:32px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(420px 260px at 8% -10%,rgba(107,147,255,.35),transparent 60%),radial-gradient(360px 240px at 100% 120%,rgba(45,212,191,.25),transparent 60%),linear-gradient(135deg,#0a0e17,#0e1420)}
.grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:32px 32px}
.logo{position:relative;z-index:2;width:74px;height:74px;flex:none;border-radius:18px;background:#0e1118;border:1px solid #2a3142;display:grid;place-items:center;box-shadow:0 16px 36px rgba(0,0,0,.55)}
.text{position:relative;z-index:2;min-width:0}
.eyebrow{font-size:8.5px;font-weight:800;letter-spacing:.2em;color:#8fa3c8;text-transform:uppercase}
h1{margin:6px 0 6px;font-size:27px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,#8db1ff,#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;font-size:11px;line-height:1.5;color:#aab4c8}
.kofi{margin-top:9px;font-size:9.5px;font-weight:700;color:#ffb3c1}
</style></head><body><div class="tile"><div class="bg"></div><div class="grid"></div>
<div class="logo"><svg viewBox="0 0 64 64" width="50" height="50"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b93ff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><rect x="1" y="1" width="62" height="62" rx="14" fill="#0e1118"/><path d="M13 16h15a6 6 0 0 1 6 6v27a5 5 0 0 0-5-5H13z" fill="url(#g)"/><path d="M51 16H36a6 6 0 0 0-6 6v27a5 5 0 0 1 5-5h16z" fill="url(#g)" opacity=".62"/><path d="M32 19.5v28" stroke="#0e1118" stroke-width="3.2"/></svg></div>
<div class="text"><div class="eyebrow">Chrome extension</div><h1>WebNovel<br><em>Dark &amp; Enhanced</em></h1><p>Dark theme · card listings<br>filters · searchable reader</p><div class="kofi">ko-fi.com/gishi</div></div>
</div></body></html>
