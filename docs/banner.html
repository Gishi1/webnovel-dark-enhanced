<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 320px; overflow: hidden; }
  body {
    font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #080b11; color: #e9ecf4;
  }
  .banner { position: relative; width: 1280px; height: 320px; display: flex; align-items: center; gap: 36px; padding: 0 56px; overflow: hidden; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(900px 420px at 8% -10%, rgba(107,147,255,.28), transparent 60%),
      radial-gradient(700px 380px at 92% 120%, rgba(45,212,191,.20), transparent 60%),
      linear-gradient(135deg, #0a0e17 0%, #0e1420 55%, #0a0e15 100%); }
  .grid { position: absolute; inset: 0; opacity: .18;
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(1000px 500px at 30% 40%, #000 30%, transparent 75%); }
  .left { position: relative; z-index: 2; flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 86px; height: 86px; border-radius: 22px; background: #0e1118; border: 1px solid #2a3142; display: grid; place-items: center; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .eyebrow { font-size: 11px; letter-spacing: .22em; font-weight: 800; color: #8fa3c8; text-transform: uppercase; }
  h1 { margin: 6px 0 8px; font-size: 44px; line-height: 1.05; letter-spacing: -.02em; font-weight: 800; }
  h1 span { background: linear-gradient(90deg, #8db1ff, #2dd4bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; font-size: 16px; color: #aab4c8; }
  .meta { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #77829a; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #3a4358; }
  .kofi { color: #ffb3c1; font-weight: 700; text-decoration: none; }
  .shot { position: relative; z-index: 2; width: 380px; height: 250px; border-radius: 16px; overflow: hidden; border: 1px solid #2b3346; box-shadow: 0 30px 70px rgba(0,0,0,.6); transform: rotate(-1.2deg); flex: none; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(8,11,17,.55)); }
</style></head>
<body>
  <div class="banner">
    <div class="bg"></div><div class="grid"></div>
    <div class="left">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 64 64" width="58" height="58"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b93ff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><rect x="1" y="1" width="62" height="62" rx="14" fill="#0e1118"/><path d="M13 16h15a6 6 0 0 1 6 6v27a5 5 0 0 0-5-5H13z" fill="url(#g)"/><path d="M51 16H36a6 6 0 0 0-6 6v27a5 5 0 0 1 5-5h16z" fill="url(#g)" opacity=".62"/><path d="M32 19.5v28" stroke="#0e1118" stroke-width="3.2"/></svg>
        </div>
        <div>
          <div class="eyebrow">Chrome extension · Manifest V3</div>
          <h1>WebNovel <span>Dark &amp; Enhanced</span></h1>
        </div>
      </div>
      <p>Dark theme · card listings · tag, book &amp; author filters · reader with searchable TOC</p>
      <div class="meta">
        <span>No tracking</span><span class="dot"></span>
        <span>Open source</span><span class="dot"></span>
        <a class="kofi" href="https://ko-fi.com/gishi">ko-fi.com/gishi</a>
      </div>
    </div>
    <div class="shot"><img src="screenshots/listing-dark.png" alt=""></div>
  </div>
</body></html>
