name: checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          find src tools -name '*.js' -o -name '*.mjs' | while read -r file; do
            node --check "$file"
          done
      - name: Manifest and icons
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('manifest.json'))
          assert m['manifest_version'] == 3
          for path in m['icons'].values():
              assert os.path.exists(path), path
          print('manifest ok, version', m['version'])
          PY
